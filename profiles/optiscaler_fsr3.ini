; Auto MultiFrame Generation — FSR 3 Frame Generation
; Положите этот файл как OptiScaler.ini рядом с игровым EXE
; вместе с OptiScaler (dxgi.dll) и amd_fidelityfx_dx12.dll.
; Insert в игре открывает оверлей. После смены FG — Save INI и перезапуск.

[Upscalers]
Dx11Upscaler=auto
Dx12Upscaler=ffx
VulkanUpscaler=ffx

[FrameGen]
Enabled=true
FGInput=fsrfg
FGOutput=fsrfg
FGNvngxReplacement=Nukems
FTInput=0
PreserveSwapChain=true
SkipResizeBuffers=true

[FSRFG]
AllowAsync=true
UseMutexForSwapchain=true
FramePacingTuning=true
FPTSafetyMarginInMs=0.01
FPTVarianceFactor=0.3

[XeFG]
IgnoreInitChecks=false
InterpolationCount=1
UnlockMFG=false
