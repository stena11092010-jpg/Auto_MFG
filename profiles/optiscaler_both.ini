; Auto MultiFrame Generation — FSR 3 + XeSS (XeFG)
; Основной выход: FSR 3. XeFG секция готова — смените FGOutput=xefg в оверлее.
; Save INI и перезапуск после смены выхода.

[Upscalers]
Dx11Upscaler=auto
Dx12Upscaler=ffx
VulkanUpscaler=ffx

[FrameGen]
Enabled=true
FGInput=fsrfg
FGOutput=fsrfg
FGNvngxReplacement=Nukems
FTInput=0
PreserveSwapChain=true
SkipResizeBuffers=true

[FSRFG]
AllowAsync=true
UseMutexForSwapchain=true
FramePacingTuning=true
FPTSafetyMarginInMs=0.01
FPTVarianceFactor=0.3

[XeFG]
IgnoreInitChecks=false
InterpolationCount=1
UnlockMFG=true
MaxInterpolatedFrames=3
DepthInverted=true
UIComposition=false
