; Auto MultiFrame Generation — XeSS Frame Generation (XeFG)
; Положите этот файл как OptiScaler.ini рядом с игровым EXE
; вместе с OptiScaler (dxgi.dll), libxess_fg.dll и libxell.dll.
; Borderless windowed, не exclusive fullscreen. Не Vulkan, не HDR16/scRGB.
; Insert в игре открывает оверлей. После смены FG — Save INI и перезапуск.

[Upscalers]
Dx11Upscaler=auto
Dx12Upscaler=xess
VulkanUpscaler=xess

[FrameGen]
Enabled=true
FGInput=upscaler
FGOutput=xefg
FGNvngxReplacement=auto
FTInput=2
PreserveSwapChain=true
SkipResizeBuffers=true

[XeFG]
IgnoreInitChecks=false
InterpolationCount=1
UnlockMFG=true
MaxInterpolatedFrames=3
DepthInverted=true
UIComposition=false
