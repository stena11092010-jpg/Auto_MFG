; Auto MultiFrame Generation — анлок XeSS / XeFG для Unreal
; Скопируйте в Engine.ini: %LOCALAPPDATA%\<Игра>\Saved\Config\Windows\Engine.ini
; DilateMotionVectors=0 обязателен для OptiFG/XeFG на UE.
; Игра — borderless, не exclusive fullscreen.

[SystemSettings]
r.XeSS.Enabled=1
r.XessFG.Enabled=1
r.NGX.DLSS.DilateMotionVectors=0
r.Streamline.DilateMotionVectors=0
r.Streamline.InitializePlugin=1
